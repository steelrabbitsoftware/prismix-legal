<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRISMIX — Documentos Legais</title>
  <meta name="description" content="Política de Privacidade e Termos de Uso do jogo PRISMIX, da Steel Rabbit Software." />
  <meta name="robots" content="index, follow" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #e8ecf4;
      background: radial-gradient(1200px 800px at 50% -10%, #1b2546 0%, #0d0d1a 55%, #07070f 100%);
    }
    .card {
      width: 100%; max-width: 460px; text-align: center;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 40px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .gem { font-size: 56px; line-height: 1; filter: drop-shadow(0 0 18px rgba(120,160,255,.55)); }
    h1 { margin: 14px 0 4px; font-size: 30px; letter-spacing: 2px; }
    .tag { margin: 0 0 28px; color: #9aa6c4; font-size: 14px; }
    a.btn {
      display: block; text-decoration: none; color: #fff; font-weight: 600;
      padding: 16px 18px; border-radius: 14px; margin: 12px 0; font-size: 16px;
      background: linear-gradient(135deg, #5b7cff, #8a5bff);
      box-shadow: 0 8px 24px rgba(91,124,255,.35); transition: transform .12s ease;
    }
    a.btn.alt { background: linear-gradient(135deg, #2bb6a8, #3b82f6); box-shadow: 0 8px 24px rgba(43,182,168,.3); }
    a.btn:active { transform: scale(.97); }
    footer { margin-top: 26px; font-size: 12px; color: #6b7691; line-height: 1.7; }
    footer a { color: #9aa6c4; }
  </style>
</head>
<body>
  <main class="card">
    <div class="gem">💎</div>
    <h1>PRISMIX</h1>
    <p class="tag">Documentos legais</p>

    <a class="btn" href="privacidade.html">Política de Privacidade</a>
    <a class="btn alt" href="termos.html">Termos de Uso</a>

    <footer>
      Steel Rabbit Software · Contato:
      <a href="mailto:techrabit99@gmail.com">techrabit99@gmail.com</a>
    </footer>
  </main>
</body>
</html>
