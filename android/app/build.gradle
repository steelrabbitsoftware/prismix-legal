plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prismix.travelheros'
    compileSdk 34

    defaultConfig {
        applicationId 'com.prismix.travelheros'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // o jogo web inteiro vira assets do app (file:///android_asset/app.html)
    sourceSets {
        main {
            assets.srcDirs += ['../../game']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
