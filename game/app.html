<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TRAVEL HEROS</title>
  <!-- Versão empacotada (script clássico único): usada pelo app Android/WebView,
       onde módulos ES sobre file:// são bloqueados. Gerada por esbuild a partir
       de js/main.js — não editar dist/bundle.js manualmente. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #14091f; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
    }
    #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #1d1030; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
